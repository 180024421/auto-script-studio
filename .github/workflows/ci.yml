name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            studio/requirements.lock.txt
            studio/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/requirements.lock.txt -r studio/requirements-dev.txt

      - name: Ruff
        run: ruff check studio packager tests tools

      - name: Validate example projects
        run: |
          python -m packager.packager_cli validate examples/ldplayer-test
          python -m packager.packager_cli validate examples/demo-game
          python -m packager.packager_cli validate examples/saocheng-game
          python -m packager.packager_cli validate examples/lingzhu-fishing
          python -m packager.packager_cli validate examples/dingtalk-remind
          # examples/mem-lock 暂不纳入：layout.json 有 id 重复（start）与 select 尺寸过小，
          # 修好后补回本列表

      - name: Run unit tests
        run: python -m pytest tests/ -q

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Android runtime
        working-directory: android-runtime
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
